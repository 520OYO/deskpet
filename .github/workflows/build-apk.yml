name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
      - name: Install Android SDK manually
        run: |
          SDK=$HOME/android-sdk
          mkdir -p $SDK/platforms $SDK/build-tools
          curl -sSL -o /tmp/plat.zip https://dl.google.com/android/repository/platform-29_r05.zip
          curl -sSL -o /tmp/bt.zip https://dl.google.com/android/repository/build-tools_r30.0.3-linux.zip
          mkdir -p /tmp/plat /tmp/bt
          unzip -q /tmp/plat.zip -d /tmp/plat
          unzip -q /tmp/bt.zip -d /tmp/bt
          P=$(ls -d /tmp/plat/*/ | head -1)
          B=$(ls -d /tmp/bt/*/ | head -1)
          rm -rf $SDK/platforms/android-29 $SDK/build-tools/30.0.3
          mv "$P" $SDK/platforms/android-29
          mv "$B" $SDK/build-tools/30.0.3
          chmod +x $SDK/build-tools/30.0.3/* 2>/dev/null
      - name: Unzip source
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -qo "$z"; done
          D=$(dirname $(find . -name settings.gradle | head -1))
          echo "PICKED=$D" >> $GITHUB_ENV
          echo "PICKED=$D"
      - name: Build unsigned APK
        run: |
          set +e
          D=${{ env.PICKED }}
          echo "sdk.dir=$HOME/android-sdk" > "$D/local.properties"
          curl -sSL -o g.zip https://services.gradle.org/distributions/gradle-6.7.1-bin.zip
          unzip -q g.zip -d /opt
          chmod +x /opt/gradle-6.7.1/bin/gradle
          /opt/gradle-6.7.1/bin/gradle -p "$D" clean assembleRelease --stacktrace --no-daemon > /tmp/build.log 2>&1
          echo "GRADLE_EXIT=$?"
          echo "### WHAT WENT WRONG ###"
          grep -A 15 "What went wrong" /tmp/build.log | head -60
          echo "### ALL APK ###"
          find . -name "*.apk" 2>/dev/null
          echo "### TAIL ###"
          tail -20 /tmp/build.log
      - name: Zipalign and collect
        run: |
          SDK=$HOME/android-sdk
          mkdir -p apkout
          U=$(find . -name "*.apk" -not -path "*/intermediates/*" | head -1)
          echo "FOUND=$U"
          cp "$U" apkout/桌宠小伴-未签名.apk
          $SDK/build-tools/30.0.3/zipalign -f 4 apkout/桌宠小伴-未签名.apk apkout/final.apk
          mv apkout/final.apk apkout/桌宠小伴-未签名.apk
          ls -la apkout
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: apkout/*.apk
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log

name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
      - name: Install Android SDK manually
        run: |
          SDK=$HOME/android-sdk
          mkdir -p $SDK/platforms $SDK/build-tools
          curl -sSL -o /tmp/plat.zip https://dl.google.com/android/repository/platform-29_r05.zip
          curl -sSL -o /tmp/bt.zip https://dl.google.com/android/repository/build-tools_r30.0.3-linux.zip
          curl -sSL -o /tmp/bt2.zip https://dl.google.com/android/repository/build-tools_r30.0.2-linux.zip
          mkdir -p /tmp/plat /tmp/bt /tmp/bt2
          unzip -q /tmp/plat.zip -d /tmp/plat
          unzip -q /tmp/bt.zip -d /tmp/bt
          unzip -q /tmp/bt2.zip -d /tmp/bt2
          P=$(ls -d /tmp/plat/*/ | head -1)
          B=$(ls -d /tmp/bt/*/ | head -1)
          B2=$(ls -d /tmp/bt2/*/ | head -1)
          rm -rf $SDK/platforms/android-29 $SDK/build-tools/30.0.3 $SDK/build-tools/30.0.2
          mv "$P" $SDK/platforms/android-29
          mv "$B" $SDK/build-tools/30.0.3
          mv "$B2" $SDK/build-tools/30.0.2
          chmod +x $SDK/build-tools/30.0.3/* $SDK/build-tools/30.0.2/* 2>/dev/null
          ls $SDK/platforms
          ls $SDK/build-tools
      - name: Unzip source and pick project
        run: |
          ls -la
          for z in *.zip; do [ -f "$z" ] && unzip -qo "$z"; done
          echo "--- settings.gradle list ---"
          find . -name settings.gradle
          D=""
          for f in $(find . -name settings.gradle); do
            d=$(dirname $f)
            if grep -q "^import java.util.List;" $d/app/src/main/java/com/deskpet/palx7k2m9/PetView.java 2>/dev/null; then D=$d; break; fi
          done
          [ -z "$D" ] && D=$(dirname $(find . -name settings.gradle | head -1))
          echo "PICKED=$D" >> $GITHUB_ENV
          echo "PICKED=$D"
      - name: Prepare keystore
        run: |
          mkdir -p ${{ env.PICKED }}/keystore
          if [ ! -f "${{ env.PICKED }}/keystore/deskpet.p12" ] && [ ! -f "${{ env.PICKED }}/keystore/deskpet.jks" ]; then
            keytool -genkeypair -keystore "${{ env.PICKED }}/keystore/deskpet.jks" -alias deskpetkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass deskpet2026 -keypass deskpet2026 \
              -dname "CN=DeskPet,OU=DeskPet,C=CN" -storetype JKS
          fi
          ls -la "${{ env.PICKED }}/keystore"
      - name: Build
        run: |
          set +e
          D=${{ env.PICKED }}
          echo "sdk.dir=$HOME/android-sdk" > "$D/local.properties"
          curl -sSL -o g.zip https://services.gradle.org/distributions/gradle-6.7.1-bin.zip
          unzip -q g.zip -d /opt
          chmod +x /opt/gradle-6.7.1/bin/gradle
          /opt/gradle-6.7.1/bin/gradle -p "$D" assembleRelease --stacktrace --no-daemon > /tmp/build.log 2>&1
          echo "GRADLE_EXIT=$?"
      - name: Error summary (READ THIS)
        if: always()
        run: |
          touch /tmp/build.log
          echo "########## WHAT WENT WRONG ##########"
          grep -A 12 "What went wrong" /tmp/build.log | head -50
          echo "########## ERROR LINES ##########"
          grep "error:" /tmp/build.log | head -30
          echo "########## TAIL ##########"
          tail -30 /tmp/build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: '**/app/build/outputs/apk/release/*.apk'
